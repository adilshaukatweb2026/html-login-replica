<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Sign Up</title>
</head>

<body>

    <nav>
        <h2>MY WEBSITE</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
            <li><a href="index.html">Login</a></li>
        </ul>
    </nav>

    <main>
        <video autoplay muted loop class="bg-video">
            <source src="./assets/video/bg2.mp4" type="video/mp4">
        </video>
        <form action="./index.html" method="post">
            <fieldset>
                <legend>
                    <h2>Sign Up</h2>
                </legend>
                <h3>Preferences</h3>
                <label for="notify">Receive Notifications</label>
                <input type="checkbox" id="notify" name="notify" role="switch">
                <!-- role switch browser ko batata hai k ye aik on/off switch hai -->
                <br><br>

                <label for="location">Preferred Job Location</label>
                <br>
                <select name="location" id="location" multiple size="4">
                    <option value="karachi">Karachi</option>
                    <option value="hyderabad">Hyderabad</option>
                    <option value="islamabad">Islamabad</option>
                    <option value="lahore">Lahore</option>
                    <option value="faisalabad">Faisalabad</option>
                    <option value="multan">Multan</option>
                    <option value="rawalpindi">Rawalpindi</option>
                    <option value="remote">Remote</option>
                </select>
                <br><br>
                <a href="#"><button type="button">Forget Password</button></a>
                <!-- forget password ki abhi koi manzil nahe -->
                <br><br>
                <button type="submit">Submit</button>
                <br><br>
                <a href="./index.html"><button type="button">Home Page</button></a>
            </fieldset>
        </form>

    </main>

    <footer>
        <p>Developed by <b>Adil Shaukat</b> Student of <b>SMIT WMA-12 Roll # 920819</b></p>
    </footer>

</body>

</html>
