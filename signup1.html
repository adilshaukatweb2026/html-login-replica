<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Sign Up</title>
</head>

<body>

    <nav>
        <h2>MY WEBSITE</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
            <li><a href="index.html">Login</a></li>
        </ul>
    </nav>

    <main>
        <video autoplay muted loop class="bg-video">
            <source src="./assets/video/bg2.mp4" type="video/mp4">
        </video>

        <form action="./signup2.html" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>
                    <h2>Sign Up</h2>
                </legend>
                <h3>General information</h3>
                <label for="name">Name</label>
                <br>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <br><br>
                <label for="email">Email</label>
                <br>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <br><br>
                <label for="pass">Password</label>
                <br>
                <input type="password" id="pass" name="pass" placeholder="Enter your password" required>
                <br><br>
                <label for="dob">Date of birth</label>
                <br>
                <input type="date" id="dob" name="dob" required>
                <br><br>
                <label for="gender">Gender</label>
                <br>
                <label for="male">Male</label>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <br><br>
                <label for="profile">Profile Picture</label>
                <br>
                <input type="file" id="profile" name="profile" accept="image/*" required>
                <br><br>

                <a href="./signup2.html"><button type="button">Next</button></a>
            </fieldset>
        </form>

    </main>

    <footer>
        <p>Developed by <b>Adil Shaukat</b> Student of <b>SMIT WMA-12 Roll # 920819</b></p>
    </footer>

</body>

</html>
